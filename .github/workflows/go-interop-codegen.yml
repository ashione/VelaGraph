name: Generate Go interop candidate
on:
  push:
    branches: [go-public-interop-281]
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23.6"
          cache: false
      - name: Install pinned official generators
        run: |
          curl --fail --location --silent --show-error --proto '=https' --tlsv1.2 https://github.com/protocolbuffers/protobuf/releases/download/v29.3/protoc-29.3-linux-x86_64.zip -o "$RUNNER_TEMP/protoc.zip"
          unzip -q "$RUNNER_TEMP/protoc.zip" -d "$RUNNER_TEMP/protoc"
          echo "$RUNNER_TEMP/protoc/bin" >> "$GITHUB_PATH"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.5
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
      - name: Generate and lock
        run: |
          bash scripts/generate-go-managed.sh
          cd examples/go/managed
          go mod tidy
          gofmt -w cmd/interop/main.go
          go test ./...
      - name: Emit reviewable generated source only
        if: always()
        run: |
          python3 - <<'PY'
          import base64,pathlib
          root=pathlib.Path("examples/go/managed")
          for p in sorted(root.rglob("*")):
              if p.is_file() and (p.suffix==".go" or p.name in ("go.mod","go.sum")):
                  b=base64.b64encode(p.read_bytes()).decode()
                  print("GO_FILE_BEGIN "+str(p))
                  for i in range(0,len(b),12000): print("GO_FILE_CHUNK "+b[i:i+12000])
                  print("GO_FILE_END")
          PY
