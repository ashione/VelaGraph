name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # The previous serial job took 36m36s cold (test 17m56 + Clippy 17m31).
  # Separate runners bound wall-clock time by the slower job; the first run
  # with the reset cache took 18m12s. Total runner minutes are roughly unchanged;
  # the split buys faster feedback.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libclang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev
          libclang_path=$(dirname "$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' -print -quit)")
          if [ -z "$libclang_path" ] || [ "$libclang_path" = "." ]; then
            echo "libclang not found" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # v1 invalidates a 34 MB cache entry left behind before `target/` was
          # populated; that old entry was never overwritten because its exact
          # key already existed.
          prefix-key: v1-rust
          cache-on-failure: false

      - name: Run tests
        run: cargo test --locked

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libclang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev
          libclang_path=$(dirname "$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' -print -quit)")
          if [ -z "$libclang_path" ] || [ "$libclang_path" = "." ]; then
            echo "libclang not found" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          cache-on-failure: false

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
