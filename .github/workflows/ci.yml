name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Static RocksDB is linked into many test binaries. Debug info exhausted the
  # hosted runner disk before tests started; keep assertions, omit symbols.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
  CARGO_BUILD_JOBS: "2"

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

  # The previous serial job took 36m36s cold (test 17m56 + Clippy 17m31).
  # Separate runners bound wall-clock time by the slower job; the first run
  # with the reset cache took 18m12s. Total runner minutes are roughly unchanged;
  # the split buys faster feedback.
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libclang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev
          libclang_path=$(dirname "$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' -print -quit)")
          if [ -z "$libclang_path" ] || [ "$libclang_path" = "." ]; then
            echo "libclang not found" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # Do not restore old, much larger debug-info build artifacts.
          prefix-key: v2-no-debug-rust
          cache-on-failure: false

      - name: Record ordinary test provenance
        env:
          REMOTE_EVENT_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          mkdir -p remote-process-evidence
          python3 - <<'PYTHON'
          import hashlib, json, os, pathlib, subprocess
          root = pathlib.Path("remote-process-evidence")
          def git(*args):
              return subprocess.check_output(["git", *args], text=True).strip()
          files = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          source = {name: hashlib.sha256(pathlib.Path(name).read_bytes()).hexdigest() for name in files if name}
          metadata = {key: os.environ.get(key) for key in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB", "GITHUB_SHA", "REMOTE_EVENT_HEAD", "CARGO_BUILD_JOBS", "CARGO_PROFILE_DEV_DEBUG", "CARGO_PROFILE_TEST_DEBUG")}
          metadata.update(head=git("rev-parse", "HEAD"), tree=git("rev-parse", "HEAD^{tree}"), source_sha256=source)
          metadata["rustc"] = subprocess.check_output(["rustc", "-Vv"], text=True)
          metadata["nproc"] = subprocess.check_output(["nproc"], text=True).strip()
          for name in ("/sys/fs/cgroup/cpu.max", "/sys/fs/cgroup/memory.max", "/proc/meminfo"):
              try:
                  metadata[name] = pathlib.Path(name).read_text()
              except OSError:
                  metadata[name] = "unavailable"
          (root / "source-provenance.json").write_text(json.dumps(metadata, indent=2) + "\n")
          PYTHON

      - name: Run tests
        env:
          VELAGRAPH_REMOTE_DIAGNOSTICS: "1"
          VELAGRAPH_REMOTE_EVIDENCE_DIR: ${{ github.workspace }}/remote-process-evidence
        run: cargo test --locked

      - name: Retain ordinary remote process evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remote-process-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: remote-process-evidence/
          if-no-files-found: error
          retention-days: 7


  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install libclang and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang libclang-dev
          libclang_path=$(dirname "$(find /usr/lib/llvm-*/lib -maxdepth 1 -name 'libclang.so*' -print -quit)")
          if [ -z "$libclang_path" ] || [ "$libclang_path" = "." ]; then
            echo "libclang not found" >&2
            exit 1
          fi
          echo "LIBCLANG_PATH=$libclang_path" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v2-no-debug-rust
          cache-on-failure: false

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
