name: Job proto generation (temporary)
on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/replicated-graph/**'
      - 'scripts/generate-public-managed-proto.sh'
      - '.github/workflows/job-proto-generate.yml'
permissions:
  contents: read
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bash scripts/generate-public-managed-proto.sh
      - run: cargo fmt --all
      - name: Export generated binding
        run: |
          echo GENERATED_BINDING_BEGIN
          base64 -w 120 crates/replicated-graph/src/managed_gateway_public_proto.rs
          echo GENERATED_BINDING_END
      - name: Export formatted sources
        run: |
          python3 - <<'PYTHON'
          import pathlib,base64,json
          names=['crates/replicated-graph/src/managed_gateway_grpc.rs','crates/replicated-graph/src/managed_gateway_grpc_codec.rs','crates/replicated-graph/src/managed_gateway_public_bounded.rs','crates/replicated-graph/tests/grpc_job_process.rs','crates/replicated-graph/tests/public_service_process.rs','crates/replicated-graph/tests/support/public_service_fixture.rs']
          for name in names:
              print('FORMATTED_FILE '+name)
              data=base64.b64encode(pathlib.Path(name).read_bytes()).decode()
              for i in range(0,len(data),120): print(data[i:i+120])
              print('FORMATTED_END')
          PYTHON
