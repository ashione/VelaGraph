name: Job test formatting (temporary)
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all
      - run: |
          echo FORMATTED_BEGIN
          base64 -w 120 crates/replicated-graph/tests/grpc_job_process.rs
          echo FORMATTED_END
