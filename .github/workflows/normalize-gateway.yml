name: Normalize gateway generated code
on:
  push:
    branches: [feat/retire-managed-gateway]
permissions:
  contents: read
jobs:
  normalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: bash scripts/generate-public-managed-proto.sh
      - run: cargo fmt --all
      - run: git diff --binary > gateway-codegen.patch
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-codegen
          path: gateway-codegen.patch
