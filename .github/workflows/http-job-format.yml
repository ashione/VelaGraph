name: HTTP job candidate formatting
on:
  pull_request:
    paths:
      - '.github/workflows/http-job-format.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: |
          cargo fmt --all
          git diff --binary > formatted.patch
      - uses: actions/upload-artifact@v4
        with:
          name: http-job-format
          path: formatted.patch

# Refresh formatting after additional lifecycle regressions.
