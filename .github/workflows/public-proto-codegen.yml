name: Public protobuf regeneration

on:
  pull_request:
    paths:
      - crates/replicated-graph/proto/public_managed.proto
      - scripts/generate-public-managed-proto.sh
      - .github/workflows/public-proto-codegen.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Regenerate checked public schema
        run: scripts/generate-public-managed-proto.sh
      - name: Format changed Rust files
        run: cargo fmt --all
      - name: Capture source and generated patch
        run: |
          git rev-parse HEAD > public-proto-source.txt
          git diff --binary > public-proto-generated.patch
          git diff --check
      - uses: actions/upload-artifact@v4
        with:
          name: public-proto-generated
          path: |
            public-proto-source.txt
            public-proto-generated.patch
