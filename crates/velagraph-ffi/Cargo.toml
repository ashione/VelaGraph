[package]
name = "velagraph-ffi"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Bounded native C ABI for VelaGraph"
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]
[dependencies]
velagraph = { path = "../.." }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
[dev-dependencies]
tempfile = "3"
