[package]
name = "d2-raft"
version = "0.1.0"
edition = "2021"
description = "D2 in-process Raft prototype for the graph storage kernel"
license = "MIT OR Apache-2.0"

[features]
default = []
# Fail-only node-local diagnostics for downstream integration tests.
test-hooks = []

[dependencies]
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
rocksdb = { version = "0.25.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "=0.10.9"
getrandom = "=0.3.4"
anyhow = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
checkpoint-object-store = { path = "../checkpoint-object-store" }
object_store = { version = "=0.14.2", features = ["aws"] }
tempfile = "3"
