[package]
name = "d2-raft"
version = "0.1.0"
edition = "2021"
description = "D2 in-process Raft prototype for the graph storage kernel"
license = "MIT OR Apache-2.0"

[dependencies]
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
rocksdb = { version = "0.25.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
