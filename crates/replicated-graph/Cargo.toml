[package]
name = "replicated-graph"
version = "0.1.0"
edition = "2021"
description = "Bounded in-process D1 adapter connecting graph records to Raft"
license = "MIT OR Apache-2.0"

[dependencies]
anyhow = "1"
velagraph = { path = "../.." }
d2-raft = { path = "../d2-raft" }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "net", "io-util", "signal"] }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
getrandom = "0.3"
tonic = "0.14"
http-body = "1"
# Public HTTP adapter: reuse the maintained, already-locked HTTP stack (MIT).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
tokio-util = "0.7"
prost = "0.14"
tonic-prost = "0.14"
tokio-stream = { version = "0.1", features = ["net", "process"] }


# Retained only for Linux managed TCP reset and process-signal regressions.
[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.6", features = ["net", "process"] }

[dev-dependencies]
hyper = { version = "1", features = ["client", "http1"] }
h2 = "0.4"
# Existing locked official crates: SHA-256 content integrity and safe anchored fs I/O.
sha2 = "=0.10.9"
rustix = { version = "=1.1.6", features = ["fs"] }
d2-raft = { path = "../d2-raft", features = ["test-hooks"] }
tempfile = "3"
