syntax = "proto3";
package velagraph.internal.operations.v1;
import "internal_managed.proto";
service ShardOperations { rpc Call(Request) returns (Response); }
message Identity { uint64 group = 1; uint64 node = 2; }
message Empty {}
message Request { uint32 version = 1; Identity identity = 2; uint64 timeout_millis = 3; oneof operation { uint64 probe = 4; uint64 metadata = 5; velagraph.internal.managed.v1.D1WriteRequest write = 6; uint64 snapshot = 7; ManagedInspect managed_inspect = 8; ManagedEnable managed_enable = 9; ManagedWrite managed_write = 10; ManagedStatusRequest managed_status = 11; } }
message Metadata { uint64 shard = 1; uint64 epoch = 2; uint64 sequence = 3; }
enum WriteStatus { WRITE_STATUS_UNSPECIFIED = 0; COMMITTED = 1; DUPLICATE = 2; }
message WriteResult { uint64 sequence = 1; WriteStatus status = 2; uint64 applied_operations = 3; }
message NotLeader { optional uint64 leader = 1; }
message Timeout { optional bytes request_id = 1; }
message RemoteFailure { oneof kind { NotLeader not_leader = 1; velagraph.internal.managed.v1.ApplicationError application = 2; Empty invalid_argument = 3; Empty resource_exhausted = 4; Empty unavailable = 5; Timeout timeout = 6; Empty session_unavailable = 7; Empty protocol = 8; } }
message Response { uint32 version = 1; oneof result { Empty probe = 2; Metadata metadata = 3; WriteResult write = 4; RemoteFailure error = 5; Snapshot snapshot = 6; ManagedModeResult managed_mode = 7; ManagedEnabled managed_enabled = 8; ManagedWritten managed_written = 9; ManagedStatusResult managed_status = 10; } }
// Reuses the channel without reusing a Metadata result. Every message executes
// the original local-epoch check. IDs are strictly increasing within one stream.
service MetadataService { rpc Exchange(stream MetadataRequest) returns (stream MetadataResponse); }
message MetadataRequest { uint32 version = 1; uint64 id = 2; Identity identity = 3; uint64 shard = 4; uint64 timeout_millis = 5; }
message MetadataResponse { uint32 version = 1; uint64 id = 2; oneof result { Metadata metadata = 3; RemoteFailure error = 4; } }

// Original one-shot snapshot contract, not a paginated snapshot assembled over time.
message SnapshotEntry { bytes key = 1; bytes value = 2; }
message Snapshot { uint64 shard = 1; uint64 epoch = 2; uint64 sequence = 3; repeated SnapshotEntry entries = 4; }
message ManagedInspect { uint64 shard = 1; uint64 epoch = 2; }
message ManagedEnable { uint64 shard = 1; uint64 epoch = 2; uint64 expected_sequence = 3; bytes mode_id = 4; }
message ManagedWrite { bytes mode_id = 1; velagraph.internal.managed.v1.D1WriteRequest request = 2; }
message ManagedStatusRequest { uint64 shard = 1; uint64 epoch = 2; bytes mode_id = 3; bytes request_id = 4; }
message ManagedMode { bytes mode_id = 1; uint64 activated_sequence = 2; }
message ManagedModeResult { ManagedMode mode = 1; }
message ManagedEnabled { bytes mode_id = 1; uint64 activated_sequence = 2; }
message ManagedWritten { bytes mode_id = 1; WriteResult result = 2; }
message ManagedStatusResult { oneof status { Empty unknown = 1; uint64 committed_sequence = 2; } }
