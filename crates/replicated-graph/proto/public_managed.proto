syntax = "proto3";
package velagraph.public.managed.v1;

// Public loopback/trusted development API. It does not expose internal Raft,
// participant control, restore, or topology changes. Plaintext is not auth.
service WriteService {
  rpc Submit(WriteRequest) returns (WriteResponse);
  rpc Status(WriteRequest) returns (WriteResponse);
  rpc Abort(WriteRequest) returns (WriteResponse);
}
service QueryService {
  rpc Open(OpenRequest) returns (OpenResponse);
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc Close(CloseRequest) returns (CloseResponse);
}
message Empty {}
// Version 2 requires exact identity; version 1 must omit it. Old servers reject
// version 2 before mutations. Identity is correlation/placement, not authentication.
message Context { uint32 version = 1; uint64 timeout_millis = 2; CallIdentity identity = 3; }
message BindingMember { uint64 shard = 1; uint64 epoch = 2; bytes mode = 3; }
enum CapacityProfile { CAPACITY_PROFILE_UNSPECIFIED = 0; LEGACY_COUNT_V1 = 1; BYTE_BOUND16_MIB_V1 = 2; }
enum Mapping { MAPPING_UNSPECIFIED = 0; PARTITION_EQUALS_SHARD_V1 = 1; }
message Binding { uint64 authority_shard = 1; bytes authority_mode = 2; uint64 coordinator_shard = 3; uint64 coordinator_epoch = 4; repeated BindingMember members = 5; CapacityProfile capacity_profile = 6; Mapping mapping = 7; }
message CallIdentity { bytes request_id = 1; Binding binding = 2; }
enum LocalReadProfile { LOCAL_READ_PROFILE_UNSPECIFIED = 0; PARITY2_MIB_V1 = 1; LOCAL_READ8_MIB_V1 = 2; }
message Scalar {
  oneof kind {
    Empty null = 1;
    sint64 integer = 2;
    double real = 3;
    string text = 4;
    bool boolean = 5;
  }
}
message Property { string key = 1; Scalar value = 2; }
message Entity { uint32 partition = 1; uint64 id = 2; }
message Vertex { uint64 id = 1; repeated string labels = 2; repeated Property properties = 3; }
message Edge { uint64 id = 1; Entity from = 2; Entity to = 3; string label = 4; repeated Property properties = 5; }
message Patch { repeated Property set = 1; repeated string remove = 2; }
message Condition { oneof kind { Empty missing = 1; Scalar value = 2; } }
message PropertyCondition { string key = 1; Condition condition = 2; }
message CreateVertex { uint32 partition = 1; Vertex vertex = 2; }
message CreateEdge { Edge edge = 1; }
message PatchEntity { Entity entity = 1; Patch patch = 2; }
message ConditionalPatch { Entity entity = 1; Patch patch = 2; repeated PropertyCondition conditions = 3; }
message ReplaceEdge { Entity edge = 1; Edge replacement = 2; }
message Mutation {
  oneof kind {
    CreateVertex create_vertex = 1;
    CreateEdge create_edge = 2;
    PatchEntity patch_vertex = 3;
    PatchEntity patch_edge = 4;
    ConditionalPatch patch_vertex_if = 5;
    ConditionalPatch patch_edge_if = 6;
    Entity delete_edge = 7;
    ReplaceEdge replace_edge = 8;
  }
}
// Reuse the same nonzero 16-byte external_id AND exact domain mutation after
// an uncertain reply. Protobuf bytes are not the durable canonical command.
message WriteRequest { Context context = 1; bytes external_id = 2; Mutation mutation = 3; }
message TerminalDecision { uint64 ordinal = 1; bool visible = 2; }
message WriteResponse {
  bytes external_id = 1;
  optional bytes transaction_id = 2;
  oneof status {
    Empty absent = 3;
    Empty pending = 4;
    TerminalDecision committed = 5;
    TerminalDecision aborted = 6;
  }
 CallIdentity identity = 31; }
message Query { uint32 partition = 1; string text = 2; }
message ReadSelector { oneof kind { Empty latest = 1; uint64 exact = 2; uint64 minimum = 3; } }
// Version is immutable for the session. Tokens identify this gateway lifetime;
// they are not credentials and cannot be redirected to another gateway.
message Session { bytes incarnation = 1; bytes token = 2; uint64 version = 3; }
message Cursor { bytes token = 1; }
message OpenRequest { Context context = 1; ReadSelector read = 2; uint64 ttl_millis = 3; Query query = 4; uint32 page_size = 5; optional LocalReadProfile profile = 6; }
message FetchRequest { Context context = 1; Session session = 2; Query query = 3; Cursor cursor = 4; uint32 page_size = 5; }
message CloseRequest { Context context = 1; Session session = 2; }
message QualifiedElement { oneof kind { Entity vertex = 1; Entity edge = 2; } }
message Path { repeated QualifiedElement elements = 1; }
message SelectedProperty { string key = 1; repeated Scalar values = 2; }
message PropertyMap { QualifiedElement source = 1; repeated SelectedProperty properties = 2; }
message ValueRow { QualifiedElement source = 1; Scalar value = 2; }
message Row { oneof kind { QualifiedElement element = 1; Path path = 2; uint64 count = 3; PropertyMap property_map = 4; ValueRow value = 5; } }
enum Completeness { COMPLETENESS_UNSPECIFIED = 0; SINGLE_PARTITION = 1; UNVERIFIED = 2; }
message Page { repeated Row rows = 1; Completeness completeness = 2; Cursor next = 3; uint32 offset = 4; uint32 total = 5; }
message OpenResponse { Session session = 1; Query query = 2; uint32 page_size = 3; Page page = 4; optional LocalReadProfile profile = 5;  CallIdentity identity = 31; }
message FetchResponse { Session session = 1; Query query = 2; Cursor cursor = 3; uint32 page_size = 4; Page page = 5;  CallIdentity identity = 31; }
message CloseResponse { Session session = 1;  CallIdentity identity = 31; }
// Stable domain detail carried in Status.details. Transport disconnection may
// have no detail: it must never be interpreted as an aborted write.
message ErrorDetail {
  enum Reason {
    REASON_UNSPECIFIED = 0;
    INVALID_ARGUMENT = 1;
    IDENTITY_MISMATCH = 2;
    RESOURCE_EXHAUSTED = 3;
    REJECTED_OUTCOME_UNCERTAIN = 4;
    PRECONDITION_FAILED = 5;
    OUTCOME_UNKNOWN = 6;
    SESSION_UNAVAILABLE = 7;
    JOB_BUSY = 8;
    QUERY_SYNTAX = 9;
    QUERY_UNSUPPORTED = 10;
    QUERY_INVALID_ARGUMENT = 11;
    QUERY_RESOURCE_EXHAUSTED = 12;
    QUERY_DEADLINE = 13;
    QUERY_INCOMPLETE_OR_CORRUPT = 14;
    QUERY_UNAVAILABLE = 15;
    QUERY_UNSUPPORTED_SCOPE = 16;
  }
  Reason reason = 1;
  CallIdentity identity = 2;
}

// A bounded materialized certified snapshot, not QueryService's single-query
// data-local result. Tokens cannot be used interchangeably. Same public listener.
service FixedSessionService {
  rpc Open(FixedOpenRequest) returns (FixedOpenResponse);
  rpc Read(FixedQueryRequest) returns (FixedQueryResponse);
  rpc Traverse(FixedQueryRequest) returns (FixedQueryResponse);
  rpc Page(FixedPageRequest) returns (FixedPageResponse);
  rpc Close(FixedCloseRequest) returns (FixedCloseResponse);
}
message FixedSession { bytes incarnation = 1; bytes token = 2; uint64 version = 3; }
// Absence selects latest once; present zero selects exact V=0, not latest.
message FixedOpenRequest { Context context = 1; optional uint64 version = 2; uint64 ttl_millis = 3; }
message FixedOpenResponse { FixedSession session = 1;  CallIdentity identity = 31; }
message FixedQueryRequest { Context context = 1; FixedSession session = 2; Query query = 3; }
message QueryData { repeated Row rows = 1; Completeness completeness = 2; }
message FixedQueryResponse { FixedSession session = 1; Query query = 2; QueryData data = 3;  CallIdentity identity = 31; }
message FixedPageRequest { Context context = 1; FixedSession session = 2; Query query = 3; Cursor cursor = 4; uint32 page_size = 5; }
message FixedPageResponse { FixedSession session = 1; Query query = 2; Cursor cursor = 3; uint32 page_size = 4; Page page = 5;  CallIdentity identity = 31; }
message FixedCloseRequest { Context context = 1; FixedSession session = 2; }
message FixedCloseResponse { FixedSession session = 1;  CallIdentity identity = 31; }

// Process-local bounded jobs on the same public listener. No durable resume.
service ManagedQueryJobService {
  rpc Start(JobStartRequest) returns (JobStartResponse);
  rpc Get(JobGetRequest) returns (JobStatusResponse);
  rpc Renew(JobRenewRequest) returns (JobRenewResponse);
  rpc Fetch(JobFetchRequest) returns (JobFetchResponse);
  rpc Cancel(JobCancelRequest) returns (JobStatusResponse);
}
message JobHandle { bytes incarnation = 1; bytes token = 2; }
message JobPolicy { uint64 idle_millis = 1; uint64 execution_millis = 2; uint64 lifetime_millis = 3; }
enum JobPhase { JOB_PHASE_UNSPECIFIED = 0; CAPTURING = 1; RUNNING = 2; SEALING = 3; READY = 4; CANCELLED = 5; EXPIRED = 6; FAILED = 7; }
// Unlike RPC status details, retained failure preserves every domain distinction.
enum JobFailure {
  JOB_FAILURE_UNSPECIFIED = 0;
  PROTOCOL = 1; BUSY = 2; IDENTITY = 3; CAPACITY = 4; REJECTED = 5;
  PRECONDITION_FAILED = 6; UNKNOWN = 7; SESSION_UNAVAILABLE = 8;
  QUERY_PARSE = 9; QUERY_UNSUPPORTED = 10; QUERY_INVALID_ARGUMENT = 11;
  QUERY_RESOURCE_EXHAUSTED = 12; QUERY_TIMEOUT = 13;
  QUERY_UNSUPPORTED_SCOPE = 14; QUERY_INCOMPLETE_OR_CORRUPT = 15; QUERY_UNAVAILABLE = 16;
}
message JobStatus { JobPhase phase = 1; optional uint64 version = 2; optional uint32 total = 3; optional JobFailure failure = 4; }
message JobStartRequest { Context context = 1; bytes operation_id = 2; optional uint64 version = 3; Query query = 4; uint32 page_size = 5; JobPolicy policy = 6; }
message JobStartResponse { bytes operation_id = 1; JobHandle job = 2;  CallIdentity identity = 31; }
message JobGetRequest { Context context = 1; JobHandle job = 2; }
message JobCancelRequest { Context context = 1; JobHandle job = 2; }
message JobStatusResponse { JobHandle job = 1; JobStatus status = 2;  CallIdentity identity = 31; }
message JobRenewRequest { Context context = 1; JobHandle job = 2; uint64 expected_generation = 3; }
message JobRenewResponse { JobHandle job = 1; uint64 generation = 2; uint64 remaining_millis = 3;  CallIdentity identity = 31; }
message JobFetchRequest { Context context = 1; JobHandle job = 2; Query query = 3; Cursor cursor = 4; uint32 page_size = 5; }
message JobFetchResponse { JobHandle job = 1; Query query = 2; Cursor cursor = 3; uint32 page_size = 4; uint64 version = 5; Page page = 6;  CallIdentity identity = 31; }
