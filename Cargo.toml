[workspace]
members = ["crates/d2-raft", "crates/replicated-graph", "crates/checkpoint-object-store"]
default-members = [".", "crates/d2-raft", "crates/replicated-graph"]
resolver = "2"

[package]
name = "velagraph"
version = "0.1.0"
edition = "2021"
description = "VelaGraph property-graph storage and Gremlin query kernel"

[lib]
name = "velagraph"
path = "src/lib.rs"

[dependencies]
rocksdb = { version = "0.25.0", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gremlin-rs = "0.1.0"
thiserror = "2"
getrandom = "0.3"

[dev-dependencies]
tempfile = "3"
